spring:
  application:
    name: shopapp-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  datasource:
    url: ${SHOPAPP_DB_URL:jdbc:postgresql://127.0.0.1:5433/shopapp}
    username: ${SHOPAPP_DB_USERNAME:shopapp}
    password: ${SHOPAPP_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  vnpay:
    enabled: ${SHOPAPP_VNPAY_ENABLED:false}
    expiry-job-enabled: ${SHOPAPP_VNPAY_EXPIRY_JOB_ENABLED:true}
    tmn-code: ${SHOPAPP_VNPAY_TMN_CODE:}
    hash-secret: ${SHOPAPP_VNPAY_HASH_SECRET:}
    public-base-url: ${SHOPAPP_PUBLIC_BASE_URL:http://localhost:4200}
  media:
    directory: ${SHOPAPP_UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${SHOPAPP_CORS_ALLOWED_ORIGINS:http://localhost:4200},${SHOPAPP_PUBLIC_BASE_URL:http://localhost:4200}
  security:
    keycloak:
      issuer-uri: ${SHOPAPP_KEYCLOAK_ISSUER:http://localhost:8081/realms/shopapp}
      jwk-set-uri: ${SHOPAPP_KEYCLOAK_JWKS:http://localhost:8081/realms/shopapp/protocol/openid-connect/certs}
      audience: shopapp-api
      admin-url: ${SHOPAPP_KEYCLOAK_ADMIN_URL:http://localhost:8081}
      realm: shopapp
      registration-client: shopapp-registration
      registration-secret: ${SHOPAPP_KEYCLOAK_SERVICE_SECRET:}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
