spring:
  application:
    name: shopapp-backend
  datasource:
    url: ${SHOPAPP_DB_URL:jdbc:postgresql://127.0.0.1:5433/shopapp}
    username: ${SHOPAPP_DB_USERNAME:shopapp}
    password: ${SHOPAPP_DB_PASSWORD:shopapp_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${SHOPAPP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    phone-number: ${SHOPAPP_ADMIN_PHONE:}
    password: ${SHOPAPP_ADMIN_PASSWORD:}
  security:
    jwt-secret: ${SHOPAPP_JWT_SECRET}
    access-token-expiration: ${SHOPAPP_ACCESS_TOKEN_EXPIRATION:3600000}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
