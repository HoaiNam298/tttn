services:
  postgres:
    image: postgres:16-alpine
    container_name: shopapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHOPAPP_POSTGRES_DB:-shopapp}
      POSTGRES_USER: ${SHOPAPP_POSTGRES_USER:-shopapp}
      POSTGRES_PASSWORD: ${SHOPAPP_POSTGRES_PASSWORD:-shopapp_dev_password}
    ports:
      - "${SHOPAPP_POSTGRES_PORT:-5433}:5432"
    volumes:
      - shopapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopapp_postgres_data:
