<mat-card appearance="outlined" class="panel">
  <div class="section-heading">
    <h1>{{ "account.favoriteProducts" | translate }}</h1>
    <button mat-stroked-button [disabled]="loading" (click)="load(page)">
      {{ "account.refresh" | translate }}
    </button>
  </div>
  @if (error) {
    <p class="error" role="alert">{{ error }}</p>
  }
  @if (loading) {
    <mat-progress-bar
      mode="indeterminate"
      [attr.aria-label]="'common.loadingData' | translate"
    />
    <p class="state">{{ "common.loadingProducts" | translate }}</p>
  } @else {
    <div class="product-grid">
      @for (product of products; track product.id) {
        <div>
          <app-product-card [product]="product" /><button
            mat-stroked-button
            [disabled]="removingId !== undefined"
            (click)="remove(product.id)"
          >
            {{ "account.removeFromFavorites" | translate }}
          </button>
        </div>
      } @empty {
        <p class="state">
          {{ "account.youHaveNoFavoriteProductsYet" | translate }}
        </p>
      }
    </div>
  }
  @if (totalPages > 1) {
    <mat-paginator
      [length]="totalElements"
      [pageIndex]="page"
      [pageSize]="12"
      [hidePageSize]="true"
      [showFirstLastButtons]="true"
      [disabled]="loading"
      (page)="load($event.pageIndex)"
      [attr.aria-label]="'common.pagination' | translate"
    />
  }
</mat-card>
