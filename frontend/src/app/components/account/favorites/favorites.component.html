<mat-card appearance="outlined" class="panel">
  <div class="section-heading">
    <h1>Sản phẩm yêu thích</h1>
    <button mat-stroked-button [disabled]="loading" (click)="load(page)">
      Làm mới
    </button>
  </div>
  @if (error) {
    <p class="error" role="alert">{{ error }}</p>
  }
  @if (loading) {
    <mat-progress-bar mode="indeterminate" aria-label="Đang tải dữ liệu" />
    <p class="state">Đang tải sản phẩm...</p>
  } @else {
    <div class="product-grid">
      @for (product of products; track product.id) {
        <div>
          <app-product-card [product]="product" /><button
            mat-stroked-button
            [disabled]="removingId !== undefined"
            (click)="remove(product.id)"
          >
            Bỏ yêu thích
          </button>
        </div>
      } @empty {
        <p class="state">Bạn chưa có sản phẩm yêu thích.</p>
      }
    </div>
  }
  @if (totalPages > 1) {
    <mat-paginator
      [length]="totalElements"
      [pageIndex]="page"
      [pageSize]="12"
      [hidePageSize]="true"
      [showFirstLastButtons]="true"
      [disabled]="loading"
      (page)="load($event.pageIndex)"
      aria-label="Phân trang"
    />
  }
</mat-card>
