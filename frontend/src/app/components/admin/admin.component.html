<mat-sidenav-container class="admin-shell">
  <mat-sidenav
    #drawer
    id="admin-navigation"
    class="admin-sidebar"
    [mode]="compact() ? 'over' : 'side'"
    [opened]="!compact()"
    [fixedInViewport]="compact()"
    aria-label="Menu quản trị"
  >
    <a class="admin-brand" routerLink="/admin/dashboard">
      <span class="brand-mark">S</span>
      <span>ShopApp<small>QUẢN TRỊ CỬA HÀNG</small></span>
    </a>
    <p class="nav-caption">Không gian quản trị</p>
    <mat-nav-list aria-label="Điều hướng quản trị">
      @for (item of navigation; track item.path) {
        <a
          mat-list-item
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="selected"
          ariaCurrentWhenActive="page"
        >
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="sidebar-footer">
      <a mat-button class="store-link" routerLink="/products">← Về cửa hàng</a>
      <small>ShopApp · Trang quản trị</small>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="admin-toolbar">
      @if (compact()) {
        <button
          mat-icon-button
          (click)="drawer.toggle()"
          aria-label="Mở hoặc đóng menu quản trị"
          [attr.aria-expanded]="drawer.opened"
          aria-controls="admin-navigation"
        >
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16 M4 12h16 M4 18h16" />
          </svg>
        </button>
      }
      <div class="toolbar-heading">
        <strong>Quản lý cửa hàng</strong
        ><small>Không gian làm việc của bạn</small>
      </div>
      <span class="toolbar-spacer"></span>
      <button
        mat-button
        class="account-button"
        [matMenuTriggerFor]="accountMenu"
        aria-label="Mở menu tài khoản quản trị"
      >
        <span class="avatar" aria-hidden="true">{{ initials }}</span>
        <span class="account-name">{{ displayName }}</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item disabled>{{ displayName }}</button>
        <a mat-menu-item routerLink="/products">Về cửa hàng</a>
        <button mat-menu-item [disabled]="loggingOut" (click)="logout()">
          {{ loggingOut ? "Đang đăng xuất..." : "Đăng xuất" }}
        </button>
      </mat-menu>
    </mat-toolbar>
    <main class="admin-content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
