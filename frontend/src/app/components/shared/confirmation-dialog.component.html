<h2 mat-dialog-title>Xác nhận thao tác</h2>
<mat-dialog-content>{{ message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial>
    Không, quay lại
  </button>
  <button mat-flat-button [mat-dialog-close]="true">Xác nhận</button>
</mat-dialog-actions>
